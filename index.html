<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>PROJECT 03 — Visual Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section id="boot" class="boot" aria-live="polite">
      <div class="boot__frame boot__frame--tl"></div>
      <div class="boot__frame boot__frame--tr"></div>
      <div class="boot__frame boot__frame--bl"></div>
      <div class="boot__frame boot__frame--br"></div>

      <div class="boot__inner">
        <p class="boot__kicker" data-boot="kicker">EXPERIMENTAL LABORATORY</p>
        <h1 class="boot__title" data-boot="title">PROJECT 03</h1>
        <p class="boot__subtitle" data-boot="subtitle">VISUAL ANALYSIS</p>
        <div class="boot__rule" data-boot="rule"></div>

        <p class="boot__status" id="boot-status">INITIALIZING…</p>
        <div class="boot__bar" data-boot="bar">
          <span class="boot__bar-fill" id="boot-bar"></span>
        </div>

        <ul class="boot__log" id="boot-log"></ul>

        <button id="start-btn" class="boot__cta" disabled>
          <span>START VISION</span>
        </button>

        <p class="boot__privacy">VIDEO PROCESSING OCCURS LOCALLY ON THIS DEVICE.</p>
      </div>
    </section>

    <section id="stage" class="stage" hidden>
      <video id="camera" class="stage__video" playsinline muted autoplay></video>
      <video id="camera-neg" class="stage__video stage__video--neg" playsinline muted autoplay></video>
      <canvas id="hud" class="stage__hud"></canvas>
      <div class="stage__grain" aria-hidden="true"></div>

      <header class="chrome chrome--top">
        <p class="chrome__title">PROJECT 03</p>
        <p class="chrome__sub">VISUAL ANALYSIS SYSTEM</p>
      </header>

      <div id="toast" class="toast" hidden></div>

      <aside class="chrome chrome--meta" id="meta-panel">
        <p id="meta-mode">MODE: FINGERS</p>
        <p id="meta-track">TRACKING: STANDBY</p>
        <p id="meta-privacy">VIDEO PROCESSING OCCURS LOCALLY ON THIS DEVICE.</p>
      </aside>

      <button id="toggle-ui" class="chrome__peek" title="Show or hide controls" aria-label="Toggle controls">
        CONTROLS
      </button>

      <nav id="controls" class="controls" aria-label="Vision controls">
        <div class="controls__row">
          <button data-action="hud" class="ctrl is-on">HUD ON</button>
          <button data-action="tracking" class="ctrl is-on">TRACKING ON</button>
          <button data-action="flip" class="ctrl">CAMERA SWITCH</button>
          <button data-action="fullscreen" class="ctrl">FULLSCREEN</button>
          <button data-action="camera" class="ctrl is-on">STOP CAMERA</button>
          <button data-action="hide" class="ctrl">HIDE</button>
        </div>
      </nav>
    </section>

    <div id="error-overlay" class="error-overlay" hidden>
      <div class="error-overlay__box">
        <p class="error-overlay__title">CAMERA UNAVAILABLE</p>
        <p class="error-overlay__body" id="error-text"></p>
        <button id="error-retry" class="boot__cta">RETRY</button>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
